<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JY Dashboard</title>
    <style>
        /* === LOGIN === */
        #login-screen {
            position: fixed; inset: 0;
            background: #0f1117;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .login-box {
            background: #1e2235;
            border: 1px solid #2a2e45;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%; max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .login-logo {
            font-size: 1.6rem; font-weight: 700; color: #fff;
            margin-bottom: 6px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .login-logo .dot {
            width: 10px; height: 10px;
            background: #6c63ff; border-radius: 50%;
            box-shadow: 0 0 8px #6c63ff;
        }
        .login-sub { color: #5c6078; font-size: 0.85rem; margin-bottom: 32px; }
        .login-label { display: block; text-align: left; font-size: 0.78rem; color: #8b8fa3; margin-bottom: 8px; }
        .login-input {
            width: 100%; padding: 12px 16px;
            background: #0f1117; border: 1px solid #2a2e45; border-radius: 10px;
            color: #e8e9f3; font-size: 1rem; outline: none;
            letter-spacing: 2px; margin-bottom: 16px; transition: border-color 0.2s;
        }
        .login-input:focus { border-color: #6c63ff; }
        .login-btn {
            width: 100%; padding: 12px;
            background: #6c63ff; color: #fff; border: none;
            border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .login-btn:hover { background: #8b83ff; transform: translateY(-1px); }
        .login-error { color: #ff4d6a; font-size: 0.82rem; margin-top: 10px; min-height: 20px; }

        /* === BASE === */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d2e;
            --bg-card: #1e2235;
            --bg-card-hover: #252a42;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --accent-glow: rgba(108, 99, 255, 0.15);
            --green: #00c896;
            --green-bg: rgba(0, 200, 150, 0.1);
            --red: #ff4d6a;
            --red-bg: rgba(255, 77, 106, 0.1);
            --text-primary: #e8e9f3;
            --text-secondary: #8b8fa3;
            --text-muted: #5c6078;
            --border: #2a2e45;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* === LAYOUT === */
        .app { display: flex; min-height: 100vh; }

        /* --- Sidebar --- */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 28px 20px;
            position: fixed; top: 0; left: 0; bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar-logo {
            font-size: 1.3rem; font-weight: 700; color: #fff;
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-logo .dot {
            width: 10px; height: 10px;
            background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }
        .sidebar-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 36px; }
        .nav-label {
            font-size: 0.62rem; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-muted);
            margin-bottom: 10px; padding-left: 12px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: var(--radius-sm);
            color: var(--text-secondary); font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s;
            margin-bottom: 4px;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--accent-glow); color: #fff;
        }
        .nav-item.active { border-left: 3px solid var(--accent); }
        .nav-icon { font-size: 1.1rem; width: 22px; text-align: center; }

        /* --- Main --- */
        .main { flex: 1; margin-left: 240px; padding: 36px 44px; }

        /* --- Header --- */
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .header-date { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        /* --- Stats Row --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 36px;
        }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px 24px;
            transition: all 0.25s;
        }
        .stat-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 1.9rem; font-weight: 700; }
        .stat-change { font-size: 0.8rem; margin-top: 6px; }
        .stat-change.up { color: var(--green); }
        .stat-change.down { color: var(--red); }

        /* --- Section --- */
        .section { margin-bottom: 40px; }
        .section-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; }

        /* --- Table --- */
        .table-wrap {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 14px 20px;
            font-size: 0.68rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-muted);
            background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
        }
        td { padding: 14px 20px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--bg-card-hover); }
        .ticker { font-weight: 700; color: #fff; }
        .badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .badge-green { background: var(--green-bg); color: var(--green); }
        .badge-red { background: var(--red-bg); color: var(--red); }

        /* --- Video Cards --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .video-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            transition: all 0.25s; cursor: pointer;
        }
        .video-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
        .video-thumb {
            width: 100%; height: 170px;
            background: linear-gradient(135deg, #1a1d2e 0%, #2a2e45 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .play-icon {
            width: 54px; height: 54px;
            background: rgba(108,99,255,0.85); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #fff;
        }
        .video-thumb .channel-badge {
            position: absolute; bottom: 10px; left: 12px;
            background: rgba(0,0,0,0.7); padding: 3px 10px;
            border-radius: 6px; font-size: 0.7rem; color: var(--text-secondary);
        }
        .video-body { padding: 16px; }
        .video-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; color: #fff; }
        .video-meta { font-size: 0.78rem; color: var(--text-muted); }
        .video-tag {
            display: inline-block; margin-top: 10px; margin-right: 4px;
            padding: 3px 10px;
            background: var(--accent-glow); color: var(--accent-light);
            border-radius: 6px; font-size: 0.72rem; font-weight: 600;
        }

        /* --- Empty State --- */
        .empty-state {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 60px 24px;
            text-align: center; color: var(--text-muted);
        }
        .empty-state .icon { font-size: 2.4rem; margin-bottom: 14px; }
        .empty-state p { font-size: 0.9rem; }

        /* --- Mobile --- */
        .menu-toggle {
            display: none; position: fixed; top: 16px; left: 16px; z-index: 200;
            background: var(--bg-card); border: 1px solid var(--border);
            color: #fff; width: 42px; height: 42px; border-radius: 10px;
            font-size: 1.3rem; cursor: pointer; align-items: center; justify-content: center;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 24px 16px; padding-top: 68px; }
            .menu-toggle { display: flex; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .video-grid { grid-template-columns: 1fr; }
        }

        /* --- Animations --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.35s ease forwards; }
        .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.1s; }
        .d3 { animation-delay: 0.15s; } .d4 { animation-delay: 0.2s; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-logo"><span class="dot"></span> JY Dashboard</div>
            <div class="login-sub">Enter your password to continue</div>
            <label class="login-label">Password</label>
            <input class="login-input" type="password" id="pw-input" placeholder="••••••••"
                   onkeydown="if(event.key==='Enter') checkPassword()">
            <button class="login-btn" onclick="checkPassword()">Unlock Dashboard</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>

    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><span class="dot"></span> JY Dashboard</div>
            <div class="sidebar-sub">AI-Powered Investing</div>
            <div class="nav-label">Menu</div>
            <div class="nav-item active" id="nav-portfolio" onclick="showSection('portfolio')">
                <span class="nav-icon">&#9733;</span> Portfolio
            </div>
            <div class="nav-item" id="nav-videos" onclick="showSection('videos')">
                <span class="nav-icon">&#9654;</span> Video Summaries
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="header">
                <h1 id="page-title">Portfolio</h1>
                <div class="header-date" id="current-date"></div>
            </div>

            <!-- PORTFOLIO SECTION -->
            <div id="section-portfolio">
                <div class="stats-row" id="stats-row"></div>
                <div class="section">
                    <div class="section-title">Stock Positions</div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ticker</th>
                                    <th>Shares</th>
                                    <th>Avg Cost</th>
                                    <th>Current Price</th>
                                    <th>Total Value</th>
                                    <th>P/L</th>
                                </tr>
                            </thead>
                            <tbody id="portfolio-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- VIDEO SUMMARIES SECTION -->
            <div id="section-videos" style="display:none;">
                <div class="section">
                    <div class="section-title">Video Summaries</div>
                    <div class="empty-state">
                        <div class="icon">&#9654;</div>
                        <p>No video summaries posted yet. Check back soon!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    // ========== YOUR PORTFOLIO DATA ==========
    // Edit these values to update your portfolio
    const PORTFOLIO = [
        { ticker: "AAPL", shares: 15,  avgCost: 178.50, currentPrice: 195.20 },
        { ticker: "NVDA", shares: 10,  avgCost: 480.00, currentPrice: 920.50 },
        { ticker: "MSFT", shares: 8,   avgCost: 370.25, currentPrice: 415.80 },
        { ticker: "TSLA", shares: 12,  avgCost: 245.00, currentPrice: 178.30 },
        { ticker: "AMZN", shares: 20,  avgCost: 155.00, currentPrice: 186.40 },
    ];

    // ========== HELPERS ==========
    function fmt(n) { return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

    // ========== RENDER ==========
    function renderPortfolio() {
        const totalValue = PORTFOLIO.reduce((s, p) => s + p.currentPrice * p.shares, 0);
        const totalCost  = PORTFOLIO.reduce((s, p) => s + p.avgCost * p.shares, 0);
        const totalPL    = totalValue - totalCost;
        const plPct      = ((totalPL / totalCost) * 100).toFixed(2);
        const isUp       = totalPL >= 0;
        const sign       = isUp ? "+" : "";

        // Stats
        document.getElementById("stats-row").innerHTML = [
            { label: "Portfolio Value",  value: fmt(totalValue), change: PORTFOLIO.length + " positions",              up: true  },
            { label: "Total Cost Basis", value: fmt(totalCost),  change: "Amount invested",                            up: true  },
            { label: "Total P/L",        value: sign + fmt(totalPL), change: sign + plPct + "% overall return",        up: isUp  },
        ].map((s, i) => `
            <div class="stat-card animate-in d${i+1}">
                <div class="stat-label">${s.label}</div>
                <div class="stat-value" style="color:${i===2 ? (isUp ? 'var(--green)' : 'var(--red)') : '#fff'}">${s.value}</div>
                <div class="stat-change ${s.up ? 'up' : 'down'}">${s.change}</div>
            </div>
        `).join("");

        // Table rows
        document.getElementById("portfolio-table").innerHTML = PORTFOLIO.map(p => {
            const pl    = (p.currentPrice - p.avgCost) * p.shares;
            const plPct = ((p.currentPrice - p.avgCost) / p.avgCost * 100).toFixed(2);
            const up    = pl >= 0;
            const sig   = up ? "+" : "";
            return `<tr>
                <td class="ticker">${p.ticker}</td>
                <td>${p.shares}</td>
                <td>${fmt(p.avgCost)}</td>
                <td>${fmt(p.currentPrice)}</td>
                <td>${fmt(p.currentPrice * p.shares)}</td>
                <td><span class="badge ${up ? 'badge-green' : 'badge-red'}">${sig}${fmt(pl)} (${sig}${plPct}%)</span></td>
            </tr>`;
        }).join("");
    }

    // ========== NAVIGATION ==========
    function showSection(name) {
        document.getElementById("section-portfolio").style.display = name === "portfolio" ? "block" : "none";
        document.getElementById("section-videos").style.display    = name === "videos"    ? "block" : "none";
        document.getElementById("nav-portfolio").classList.toggle("active", name === "portfolio");
        document.getElementById("nav-videos").classList.toggle("active",    name === "videos");
        document.getElementById("page-title").textContent = name === "portfolio" ? "Portfolio" : "Video Summaries";
        if (window.innerWidth < 769) document.getElementById("sidebar").classList.remove("open");
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }

    // ========== PASSWORD ==========
    function checkPassword() {
        const input = document.getElementById("pw-input").value;
        if (input === "PaSsWoRd") {
            document.getElementById("login-screen").style.display = "none";
        } else {
            document.getElementById("login-error").textContent = "Incorrect password. Please try again.";
            document.getElementById("pw-input").value = "";
            document.getElementById("pw-input").focus();
        }
    }

    // ========== INIT ==========
    document.getElementById("current-date").textContent = new Date().toLocaleDateString("en-US", {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
    renderPortfolio();
    </script>
</body>
</html>
